name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Auto-Fix Android Structure, App Name (LxH ONE) & Permissions
        run: |
          rm -rf android
          flutter create . --platforms android --project-name tractor_jcb_khata
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          sed -i 's/android:label="[^"]*"/android:label="LxH ONE"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_CONTACTS"/><uses-permission android:name="android.permission.SEND_SMS"/><uses-permission android:name="android.permission.CALL_PHONE"/>' android/app/src/main/AndroidManifest.xml
          sed -i "s/Tractor & JCB Khata/LxH ONE/g" lib/main.dart || true
          sed -i "s/Tractor JCB Khata/LxH ONE/g" lib/main.dart || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Lightweight & Fast Install)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LxH-ONE-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
