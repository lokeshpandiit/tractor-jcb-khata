name: Build APK

on:
  push:
    branches: [ main, master, v3 ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Preserve app manifest and generate Android wrapper
        shell: bash
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/lxh-android-manifest.xml
          rm -rf android
          flutter create . --platforms android --project-name tractor_jcb_khata
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          cp /tmp/lxh-android-manifest.xml android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="LxH ONE"' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LxH-ONE-V3-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
